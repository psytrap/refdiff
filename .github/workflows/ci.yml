name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]
        python-version: [ '3.10', '3.12' ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Node dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Run JavaScript unit tests
        run: npm test

      - name: Run Archived Python prototype unit tests
        run: PYTHONPATH=archive/python-prototype python -m unittest discover archive/python-prototype/tests

      - name: Verify Archived Python CLI smoke test
        run: python archive/python-prototype/refdiff.py --help

